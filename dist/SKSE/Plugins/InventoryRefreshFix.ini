[General]
; Materializes the native inventory row sequence once per item-list refresh instead
; of rebuilding and rescanning it for every indexed request.
bEnableInventoryEnumeration=1

; Compares the first bulk sequence of each game session against the complete native
; indexed sequence. A mismatch disables the optimization for the rest of the session.
bValidateInventoryEnumeration=1

; Uses a lightweight visible-list update when item identity, order, and categories
; are unchanged. Set to 1 to enable the experimental optimization.
bEnableIncrementalInvalidation=1

; 0 keeps profiling-only behavior. Set to 1 to enable experimental coalescing.
bEnableRefreshCoalescing=0
